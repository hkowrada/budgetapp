<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KOWRADA - Family Portal</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="KOWRADA Family Portal - Your digital family hub">
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./icon-192x192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: hidden;
            background: #0f0f1e;
            color: white;
            min-height: 100vh;
            position: relative;
        }

        /* Animated Gradient Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .shape1 {
            width: 300px;
            height: 300px;
            background: #667eea;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape2 {
            width: 250px;
            height: 250px;
            background: #f093fb;
            bottom: 20%;
            right: 15%;
            animation-delay: 5s;
        }

        .shape3 {
            width: 200px;
            height: 200px;
            background: #4facfe;
            top: 50%;
            right: 10%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Logo/Title */
        .logo {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease;
        }

        .logo h1 {
            font-size: clamp(48px, 12vw, 120px);
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .logo p {
            font-size: clamp(14px, 3vw, 18px);
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s ease 0.3s both;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .card-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card-title {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
            color: white;
        }

        .card-description {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: clamp(14px, 3vw, 16px);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .access-btn {
            display: block;
            width: 100%;
            padding: 18px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: clamp(16px, 4vw, 18px);
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            border: none;
            cursor: pointer;
        }

        .access-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .access-btn:active {
            transform: translateY(-1px);
        }

        /* Features */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .feature-item {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        .feature-item .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .feature-item .text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            animation: fadeIn 1s ease 1s both;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
                justify-content: flex-start;
                padding-top: 60px;
            }

            .logo {
                margin-bottom: 40px;
            }

            .glass-card {
                padding: 35px 25px;
                border-radius: 25px;
            }

            .card-icon {
                width: 70px;
                height: 70px;
                font-size: 35px;
                margin-bottom: 20px;
            }

            .features {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .feature-item {
                padding: 12px;
            }

            .shape {
                filter: blur(40px);
            }

            .footer {
                position: relative;
                margin-top: 40px;
                bottom: auto;
            }
        }

        @media (max-width: 480px) {
            .logo h1 {
                font-size: 56px;
            }

            .glass-card {
                padding: 30px 20px;
            }

            .access-btn {
                padding: 16px 30px;
                font-size: 16px;
            }
        }

        /* Loading animation */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f1e;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease 1s forwards;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeOut {
            to { 
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading">
        <div class="loading-spinner"></div>
    </div>

    <!-- Animated Background -->
    <div class="animated-bg"></div>
    
    <!-- Floating Shapes -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <!-- Main Content -->
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <h1>KOWRADA</h1>
            <p>Family Portal</p>
        </div>

        <!-- Main Card -->
        <div class="glass-card">
            <div class="card-icon">💰</div>
            <h2 class="card-title">Expense Tracker</h2>
            <p class="card-description">
                Manage your family finances with ease. Track expenses, set budgets, and monitor spending patterns.
            </p>
            <a href="./app.html" class="access-btn">
                Access Tracker
            </a>

            <!-- Features -->
            <div class="features">
                <div class="feature-item">
                    <div class="icon">🔒</div>
                    <div class="text">Secure</div>
                </div>
                <div class="feature-item">
                    <div class="icon">📱</div>
                    <div class="text">Mobile Ready</div>
                </div>
                <div class="feature-item">
                    <div class="icon">📊</div>
                    <div class="text">Analytics</div>
                </div>
                <div class="feature-item">
                    <div class="icon">🌐</div>
                    <div class="text">Cloud Sync</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            © 2024 KOWRADA Family · Made with ❤️
        </div>
    </div>

    <script>
        // Service Worker Registration (for PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('✅ Service Worker registered'))
                    .catch(err => console.log('❌ Service Worker registration failed'));
            });
        }

        // Add touch feedback for mobile
        document.querySelectorAll('.access-btn, .feature-item').forEach(element => {
            element.addEventListener('touchstart', function() {
                this.style.opacity = '0.8';
            });
            element.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        });

        // Smooth entrance
        document.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
