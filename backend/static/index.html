<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Expense Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-wallet"></i>
                    <h1>Family Expense Tracker</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="showAddExpenseModal()" data-testid="add-expense-btn">
                        <i class="fas fa-plus"></i> Add Expense
                    </button>
                    <button class="btn btn-secondary" onclick="showManageCategoriesModal()" data-testid="manage-categories-btn">
                        <i class="fas fa-tags"></i> Manage Categories
                    </button>
                </div>
            </div>
        </header>

        <!-- Dashboard Summary -->
        <section class="summary-section">
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="card-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <i class="fas fa-euro-sign"></i>
                    </div>
                    <div class="card-content">
                        <h3>Total Expenses</h3>
                        <p class="amount" id="totalExpenses" data-testid="total-expenses">€0.00</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div class="card-content">
                        <h3>This Month</h3>
                        <p class="amount" id="monthExpenses" data-testid="month-expenses">€0.00</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                        <i class="fas fa-chart-pie"></i>
                    </div>
                    <div class="card-content">
                        <h3>Categories</h3>
                        <p class="amount" id="totalCategories" data-testid="total-categories">0</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div class="card-content">
                        <h3>Total Records</h3>
                        <p class="amount" id="totalRecords" data-testid="total-records">0</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Filters -->
        <section class="filters-section">
            <div class="filters">
                <div class="filter-group">
                    <label for="filterCategory"><i class="fas fa-filter"></i> Category</label>
                    <select id="filterCategory" onchange="applyFilters()" data-testid="filter-category">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterMember"><i class="fas fa-user"></i> Member</label>
                    <select id="filterMember" onchange="applyFilters()" data-testid="filter-member">
                        <option value="">All Members</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterStartDate"><i class="fas fa-calendar-alt"></i> Start Date</label>
                    <input type="date" id="filterStartDate" onchange="applyFilters()" data-testid="filter-start-date">
                </div>
                <div class="filter-group">
                    <label for="filterEndDate"><i class="fas fa-calendar-alt"></i> End Date</label>
                    <input type="date" id="filterEndDate" onchange="applyFilters()" data-testid="filter-end-date">
                </div>
                <button class="btn btn-clear" onclick="clearFilters()" data-testid="clear-filters-btn">
                    <i class="fas fa-times"></i> Clear
                </button>
            </div>
        </section>

        <!-- Expenses Table -->
        <section class="expenses-section">
            <h2><i class="fas fa-list"></i> Expense Records</h2>
            <div class="table-container">
                <table class="expenses-table" data-testid="expenses-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Member</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTableBody">
                        <tr>
                            <td colspan="6" class="no-data">No expenses recorded yet. Add your first expense!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Category Summary -->
        <section class="category-summary-section">
            <h2><i class="fas fa-chart-bar"></i> Expenses by Category</h2>
            <div id="categoryChart" class="category-chart" data-testid="category-chart"></div>
        </section>
    </div>

    <!-- Add Expense Modal -->
    <div id="addExpenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> Add New Expense</h2>
                <button class="close-btn" onclick="closeModal('addExpenseModal')" data-testid="close-expense-modal">&times;</button>
            </div>
            <form id="addExpenseForm" onsubmit="handleAddExpense(event)">
                <div class="form-group">
                    <label for="expenseAmount">Amount (€)</label>
                    <input type="number" id="expenseAmount" step="0.01" required data-testid="expense-amount-input">
                </div>
                <div class="form-group">
                    <label for="expenseCategory">Category</label>
                    <select id="expenseCategory" required data-testid="expense-category-select"></select>
                </div>
                <div class="form-group">
                    <label for="expenseDate">Date</label>
                    <input type="date" id="expenseDate" required data-testid="expense-date-input">
                </div>
                <div class="form-group">
                    <label for="expenseDescription">Description</label>
                    <input type="text" id="expenseDescription" required data-testid="expense-description-input">
                </div>
                <div class="form-group">
                    <label for="expenseMember">Family Member</label>
                    <input type="text" id="expenseMember" required data-testid="expense-member-input">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addExpenseModal')" data-testid="cancel-expense-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" data-testid="submit-expense-btn">
                        <i class="fas fa-save"></i> Save Expense
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Manage Categories Modal -->
    <div id="manageCategoriesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-tags"></i> Manage Categories</h2>
                <button class="close-btn" onclick="closeModal('manageCategoriesModal')" data-testid="close-categories-modal">&times;</button>
            </div>
            <div class="categories-container">
                <form id="addCategoryForm" onsubmit="handleAddCategory(event)" class="add-category-form">
                    <input type="text" id="newCategoryName" placeholder="New category name" required data-testid="new-category-input">
                    <button type="submit" class="btn btn-primary" data-testid="add-category-btn">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </form>
                <div id="categoriesList" class="categories-list" data-testid="categories-list"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
